packages:
  - .

# The published bus wrapper intentionally consumes the shared core library from
# its Git repository, so this legacy transitive source must remain permitted.
blockExoticSubdeps: false
autoInstallPeers: false

# Prisma Studio is build-time tooling; its optional React UI peers are not used
# by the API or included in the production image.
peerDependencyRules:
  ignoreMissing:
    - '@types/react'
    - react
    - react-dom

overrides:
  '@hono/node-server@^1.0.0': 1.19.13
  '@isaacs/brace-expansion': 5.0.1
  'ajv@^6.0.0': 6.14.0
  'ajv@^8.0.0': 8.18.0
  axios: 1.18.1
  'brace-expansion@^1.0.0': 1.1.13
  'brace-expansion@^2.0.0': 2.0.3
  defu: 6.1.7
  'effect@^3.0.0': 3.22.0
  'fast-uri@^3.0.0': 3.1.2
  'file-type@^21.0.0': 21.3.2
  follow-redirects: 1.16.0
  form-data: 4.0.6
  hono: 4.12.31
  'js-yaml@^4.0.0': 4.2.0
  lodash: 4.18.1
  'minimatch@^3.0.0': 3.1.4
  'minimatch@^5.0.0': 5.1.8
  multer: 2.2.0
  path-to-regexp: 8.4.2
  'picomatch@^2.0.0': 2.3.2
  'picomatch@^4.0.0': 4.0.5
  'piscina@^4.0.0': 4.9.3
  qs: 6.15.3

allowBuilds:
  '@nestjs/core': false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  dtrace-provider: false
  prisma: true
  unrs-resolver: true
